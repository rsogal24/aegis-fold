[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisfold"
version = "0.1.0"
description = "Sequence-structure fusion research for defensive protein screening"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
authors = [{ name = "AegisFold contributors" }]
dependencies = [
    "numpy>=1.26,<2",
    "torch==2.10.0",
    "transformers>=4.40,<5",
    "fair-esm>=2.0.0,<3",
    "biotite==0.41.2",
    "pydantic>=2.6,<3",
    "PyYAML>=6,<7",
    "typer>=0.12,<1",
    "rich>=13,<15",
]

[project.scripts]
aegisfold = "aegisfold.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

